name: Claude PR Review

# Fires only when a PR is raised, not on every push to it.
#
# IMPORTANT: this event does NOT fire for PRs created with Actions' built-in
# GITHUB_TOKEN (GitHub suppresses that to prevent workflow recursion). It DOES
# fire for PRs raised with a PAT or a GitHub App installation token, which is
# what Jarvis uses. If Jarvis ever moves inside Actions, this silently stops.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: read
  # Required for claude-code-action's OAuth token exchange. Without this the
  # step fails after 3 retries with "Could not fetch an OIDC token" and never
  # reviews anything (confirmed 2026-09-03 on jarvis-github-control PR #2).
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: '--allowedTools "Bash(gh pr merge:*)"'
          prompt: |
            Review this pull request for correctness bugs and post your findings
            as a PR comment. Lead with real defects; do not pad with style nits.

            Then decide on merging. Merge ONLY if ALL of these hold:
              - the change is genuinely low-risk: docs, comments, formatting,
                tests, or a dependency bump within a minor version
              - it does NOT touch auth, secrets, migrations, deletions, CI
                config, network calls, or public API surface
              - you found no correctness issues

            If every condition holds, run:
              gh pr merge --auto --squash
            Otherwise leave the PR open and state plainly why you did not merge.
            When in doubt, do not merge. Leaving a PR open is always safe;
            merging a bad one is not.
